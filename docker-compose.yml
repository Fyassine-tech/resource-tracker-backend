services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resource_tracker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resource_tracker"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["5432:5432"]

  api:
    build: .
    env_file: [.env.development]
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
